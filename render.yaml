# Render Blueprint for EntriX on the FREE tier. See DEPLOY.md for the step-by-step.
#
# One free web service runs everything that Render would otherwise charge for:
#   - the API,
#   - the email worker (RUN_WORKER_IN_API: free plans have no background workers),
#   - database migrations (RUN_MIGRATIONS_ON_START: free plans have no pre-deploy command).
# The database is Neon (free, does not expire after 30 days like Render's free Postgres) and
# there is no Redis (rate limits and the cache live in memory, correct for one instance).
# Email goes out over HTTPS through Brevo, because free web services cannot use SMTP ports.
#
# The full paid architecture is in render.paid.yaml.
# Values marked `sync: false` are asked for once, when the Blueprint is first created.

services:
  - type: web
    name: entrix-api
    runtime: docker
    plan: free # set explicitly: when `plan` is omitted Render picks a paid default
    # IMPORTANT: use the Render region nearest your Neon project (Neon's dashboard shows its
    # region); every request makes several database round trips, so distance costs real time.
    region: singapore
    healthCheckPath: /livez # does not touch the database, so it never wakes a sleeping Neon
    envVars:
      - key: ENV
        value: prod
      - key: AUTH_MODE
        value: clerk
      # Neon: copy the DIRECT connection string (not the "pooled" one). postgres:// URLs,
      # sslmode and channel_binding are all handled by the app.
      - key: DATABASE_URL
        sync: false
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: QR_SECRET
        sync: false
      - key: CLERK_ISSUER # e.g. https://your-app.clerk.accounts.dev
        sync: false
      - key: CLERK_JWKS_URL # <issuer>/.well-known/jwks.json
        sync: false
      # How many reverse proxies sit in front of the app; check it after deploy (DEPLOY.md).
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      # Sleep up to an hour when no email is waiting, so an idle database can suspend. A new
      # registration wakes the worker immediately; this only bounds the idle sleep.
      - key: OUTBOX_IDLE_POLL_SECONDS
        value: "3600"
      - key: EMAIL_BACKEND
        value: brevo
      - key: BREVO_API_KEY # a Brevo API key (not the SMTP key). Never commit it.
        sync: false
      # The address you verified in Brevo: PLAIN, e.g. you@gmail.com. No quotes, no <angle
      # brackets>, no name (a value like  EntriX <you@gmail.com>  is easy to mistype here).
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME # the name recipients see
        value: EntriX
      # No REDIS_URL on purpose: in-memory rate limiting and cache, which is correct for the
      # single process below. (More than one worker process would give each its own counters.)
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
