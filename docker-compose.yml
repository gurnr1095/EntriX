services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sportreg
      POSTGRES_PASSWORD: sportreg
      POSTGRES_DB: sportreg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportreg -d sportreg"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
