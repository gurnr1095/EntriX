# Local development: `docker compose up -d postgres redis mailhog` runs just the backing
# services (use this while running uvicorn and pytest on your machine).
# Everything in containers: `docker compose up -d --build`.
#
# AUTH_MODE=dev here is for local use only; the app refuses to start with it when ENV=prod.

x-app-env: &app-env
  ENV: dev
  AUTH_MODE: dev
  DATABASE_URL: postgresql+asyncpg://sportreg:sportreg@postgres:5432/sportreg
  REDIS_URL: redis://redis:6379/0
  QR_SECRET: ${QR_SECRET:-local-dev-qr-secret-do-not-use-in-prod}
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  # Tunable from the shell, e.g. for load tests:
  #   RATE_LIMIT_IP_PER_MIN=1000000 CACHE_ENABLED=false docker compose up -d api
  RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-60}
  RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-10}
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sportreg
      POSTGRES_PASSWORD: sportreg
      POSTGRES_DB: sportreg
    ports:
      - "5433:5432"  # 5433 on the host: a native Postgres may already own 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportreg -d sportreg"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # Free-tier profile, to try locally: worker inside the API, migrations at start.
      RUN_WORKER_IN_API: ${RUN_WORKER_IN_API:-false}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-false}
      OUTBOX_IDLE_POLL_SECONDS: ${OUTBOX_IDLE_POLL_SECONDS:-2}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    command: ["python", "-m", "app.worker.outbox_worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

volumes:
  pgdata:
