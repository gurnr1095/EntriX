name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sportreg
          POSTGRES_PASSWORD: sportreg
          POSTGRES_DB: sportreg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportreg -d sportreg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://sportreg:sportreg@localhost:5432/sportreg
      TEST_DATABASE_URL: postgresql+asyncpg://sportreg:sportreg@localhost:5432/sportreg_test
      REQUIRE_REDIS: "1" # the Redis backend tests must run in CI, never skip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Create the test database
        run: |
          PGPASSWORD=sportreg psql -h localhost -U sportreg -d sportreg \
            -c "CREATE DATABASE sportreg_test"

      - name: Migrate (checks the migration applies to an empty database)
        run: alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
